# Composite equivalent of the GitLab `.gradle-base` before_script:
# Java toolchain, SDK licenses, and the preview-channel platform the
# app compiles against.
#
# app/google-services.json is committed in the repo (ENC-224, the Stratum
# STR-204 shape), so no secret materializes it here anymore. The old
# GOOGLE_SERVICES_JSON secret held a wrong-package file and clobbering the
# committed file with it broke :app:processNormalDebugGoogleServices.
name: android-setup
description: Shared Android job setup (port of .gradle-base before_script)

inputs:
  java-version:
    description: JDK for Gradle (daemon JVM per gradle/gradle-daemon-jvm.properties)
    required: false
    default: "21"

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Verify committed app/google-services.json
      shell: bash
      run: |
        test -f app/google-services.json || (echo "app/google-services.json is committed in the repo (ENC-224) and is missing from this checkout" && exit 1)
        chmod +x gradlew

    # GitHub-hosted runners ship the Android SDK with ANDROID_HOME set, so
    # the GitLab docker image's bundled SDK is replaced by the runner's;
    # the license + preview-platform steps install what Enclave pins.
    - name: Accept SDK licenses and install compile platform
      shell: bash
      run: |
        # Actions runs bash with -eo pipefail: a `yes |` feeder dying of
        # SIGPIPE would poison the pipeline status, so drop pipefail here
        # and judge sdkmanager by the install result below instead.
        set +o pipefail
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
        command -v sdkmanager || (echo "sdkmanager not found under $ANDROID_HOME" && exit 1)
        # Best-effort license acceptance (output kept out of the log); the
        # install fails loudly if a license is genuinely missing.
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        # The app compiles against 37, published as android-37.0 on the
        # preview channel (3); fall back to the default channel in case it
        # has graduated. Output is NOT silenced — a failed install must
        # say why in the log.
        sdkmanager --channel=3 "platforms;android-37.0" || sdkmanager "platforms;android-37.0"
