# Materialize the third_party submodules CI actually consumes.
#
# Why this composite instead of `actions/checkout` with `submodules: true`:
# CI jobs selectively fetch whisper-android and/or agent_core (inputs below),
# and they skip docgen_core (no Gradle/CI consumer). The clones below use
# absolute public HTTPS URLs under github.com/shippopotamuslabs (the same
# org/repos `.gitmodules` resolves to via relative sibling paths today;
# ENC-322 makes those `.gitmodules` entries absolute):
#
#   https://github.com/shippopotamuslabs/whisper-android.git
#   https://github.com/shippopotamuslabs/agent_core.git
#
# Pins:
#   whisper-android  gitlink 32682cbcc71b206970fb964b5000d75361465ad5
#   agent_core       recorded gitlink from `git ls-tree HEAD` (repaired by ENC-283)
#
# whisper.cpp needs no workaround: its `.gitmodules` URL is the public
# upstream (ggml-org/whisper.cpp) and its pin is fetched via
# `git submodule update --init`.
#
# third_party/docgen_core is deliberately NOT fetched: no Gradle build
# input or CI job consumes it (only a detekt exclude glob names it).
#
# The token input is optional. Sibling repos are public on GitHub, so
# anonymous HTTPS clones succeed. Callers may still pass a GitHub App
# installation token (TENSOR_APP_ID / TENSOR_APP_PRIVATE_KEY) when they
# want authenticated clones.
name: fetch-submodules
description: Fetch whisper-android / agent_core / whisper.cpp at recorded pins

inputs:
  token:
    description: Optional token for authenticated sibling clones (empty = anonymous public HTTPS)
    required: false
    default: ""
  whisper-android:
    description: Fetch third_party/whisper-android (+ whisper.cpp pins)
    required: false
    default: "true"
  agent-core:
    description: Fetch third_party/agent_core
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: whisper.cpp (public upstream)
      if: inputs.whisper-android == 'true'
      shell: bash
      run: git submodule update --init third_party/whisper.cpp

    - name: whisper-android (public GitHub, recorded gitlink)
      if: inputs.whisper-android == 'true'
      shell: bash
      env:
        SUBMODULE_TOKEN: ${{ inputs.token }}
      run: |
        rm -rf third_party/whisper-android
        if [ -n "$SUBMODULE_TOKEN" ]; then AUTH="x-access-token:${SUBMODULE_TOKEN}@"; else AUTH=""; fi
        git clone --quiet "https://${AUTH}github.com/shippopotamuslabs/whisper-android.git" third_party/whisper-android
        git -C third_party/whisper-android checkout --quiet 32682cbcc71b206970fb964b5000d75361465ad5
        # whisper-android carries its own whisper.cpp submodule (public).
        git -C third_party/whisper-android submodule update --init third_party/whisper.cpp

    - name: agent_core (public GitHub, at the pin recorded in the superproject)
      if: inputs.agent-core == 'true'
      shell: bash
      env:
        SUBMODULE_TOKEN: ${{ inputs.token }}
      run: |
        rm -rf third_party/agent_core
        if [ -n "$SUBMODULE_TOKEN" ]; then AUTH="x-access-token:${SUBMODULE_TOKEN}@"; else AUTH=""; fi
        git clone --quiet "https://${AUTH}github.com/shippopotamuslabs/agent_core.git" third_party/agent_core
        PIN=$(git ls-tree HEAD third_party/agent_core | awk '{print $3}')
        git -C third_party/agent_core checkout --quiet "$PIN"
