[package]
name = "classifier_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
uniffi = { version = "0.31.2", default-features = true, features = ["cli"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/uniffi-bindgen.rs"
