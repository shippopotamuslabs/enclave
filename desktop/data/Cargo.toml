[package]
name = "enclave-desktop-data"
version = "0.1.0"
edition = "2021"

[dependencies]
enclave-desktop-domain = { path = "../domain" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
thiserror = "2.0"
uuid = { version = "1.8", features = ["v4"] }

