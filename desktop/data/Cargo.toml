[package]
name = "enclave-desktop-data"
version = "0.1.0"
edition = "2021"

[dependencies]
enclave-desktop-domain = { path = "../domain" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.8", features = ["v4"] }
async-trait = "0.1"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
rusqlite_migration = "2.6"
argon2 = "0.5"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
rand = "0.8"
dirs = "5"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
